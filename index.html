<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ベネフィットプラン お申し込み｜Japan電力</title><meta name="description" content="Japan電力 ハーモニーでんき ベネフィットプランのお申し込みフォームです。"><link rel="stylesheet" href="assets/style.css"></head><body>
<header><a class="brand" href="https://www.japaden.jp/"><img src="assets/logo_top.svg" alt="Japan電力"></a><div class="plan"><small>ハーモニーでんき</small>ベネフィットプラン</div></header>
<main><section class="hero"><p class="en">BENEFIT PLAN</p><h1>お申し込みフォーム</h1><p>必要事項をご入力ください。<br>お申し込みはかんたん、約<b>3分</b>で完了します。</p><div class="steps"><span class="active"><i>1</i>お客様情報の入力</span><hr><span><i>2</i>受付完了</span></div></section>
<form class="form" action="thanks/"><div class="formTitle"><i>●</i><span><small>お客様情報</small><h2>ご契約者さまについて</h2></span></div>
<div class="field"><label for="name">お名前 <em>必須</em></label><input id="name" name="name" autocomplete="name" placeholder="例）電力 太郎" required></div>
<div class="field"><label for="address">ご住所 <em>必須</em></label><input id="address" name="address" autocomplete="street-address" placeholder="例）東京都千代田区〇〇 1-2-3" required></div>
<fieldset class="field"><legend>住居形態 <em>必須</em></legend><div class="radios"><label><input type="radio" name="housing" value="house" required><span><i></i>戸建て</span></label><label><input type="radio" name="housing" value="apartment" required><span><i></i>集合住宅</span></label></div></fieldset>
<div class="field"><label for="email">メールアドレス <em>必須</em></label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="例）taro@example.com" required><small>受付完了メールをお送りします。</small></div>
<div class="field"><label for="tel">電話番号 <em>必須</em></label><input id="tel" name="tel" type="tel" autocomplete="tel" inputmode="tel" pattern="[0-9ー－―‐-]{10,14}" placeholder="例）09012345678" required><small>ハイフンなしでご入力ください。</small></div>
<div class="field"><label for="company">現在ご利用の電力会社 <em>必須</em></label><div class="select"><select id="company" name="company" required><option value="" selected disabled>選択してください</option><option>北海道電力</option><option>東北電力</option><option>東京電力</option><option>中部電力</option><option>北陸電力</option><option>関西電力</option><option>中国電力</option><option>四国電力</option><option>九州電力</option><option>その他</option></select></div></div>
<label class="privacy"><input type="checkbox" required><span><i></i>Japan電力の<a href="https://japaden.jp/privacy/" target="_blank" rel="noreferrer">プライバシーポリシー</a>に同意する</span></label>
<button class="primary" type="submit">入力内容を送信する <b>›</b></button><p class="secure">✓ お客様の情報はSSL暗号化通信により安全に送信されます</p></form></main>

</body></html>
